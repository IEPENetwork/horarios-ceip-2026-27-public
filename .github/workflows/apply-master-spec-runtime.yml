name: Apply validated master-spec runtime

on:
  push:
    branches:
      - rebuild/master-spec-runtime
    paths:
      - .github/workflows/apply-master-spec-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/master-spec-runtime
      - name: Decode validated runtime payloads
        env:
          SCHEDULE_GZ_B64: 
          SUBSTITUTIONS_GZ_B64: 
        run: |
          python - <<'PY'
          import os, base64, gzip, pathlib
          payloads = {
              'src/data/schedule-v2.json': os.environ['SCHEDULE_GZ_B64'],
              'src/data/substitutions-v2.json': os.environ['SUBSTITUTIONS_GZ_B64'],
          }
          for path, encoded in payloads.items():
              pathlib.Path(path).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
      - name: Validate JSON payloads
        run: |
          python - <<'PY'
          import json
          for path in ['src/data/schedule-v2.json','src/data/substitutions-v2.json']:
              with open(path, encoding='utf-8') as handle:
                  json.load(handle)
          PY
      - name: Commit runtime only and remove temporary workflow
        run: |
          git config user.name "OpenAI timetable automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/schedule-v2.json src/data/substitutions-v2.json
          git rm .github/workflows/apply-master-spec-runtime.yml
          git commit -m "feat: rebuild timetable from validated master spec"
          git push origin HEAD:rebuild/master-spec-runtime
